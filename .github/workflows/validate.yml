name: Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  yaml-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq yamllint jq
          pip install --quiet yamllint 2>/dev/null || true

      - name: Validate YAML
        run: |
          find . -name '*.yml' -o -name '*.yaml' | grep -v node_modules | while read f; do
            echo "Checking $f"
            yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable}}" "$f" || true
          done

      - name: Validate Grafana dashboard JSON
        run: |
          find grafana/dashboards -name '*.json' | while read f; do
            echo "Validating $f"
            jq empty "$f"
            jq -e '.title and .uid and .panels' "$f" > /dev/null
          done

      - name: Validate docker-compose structure
        run: |
          # Basic structural check without full docker
          python3 -c "
          import yaml, sys
          with open('docker-compose.yml') as f:
              data = yaml.safe_load(f)
          assert 'services' in data
          assert 'grafana' in data['services']
          assert 'prometheus' in data['services']
          print('docker-compose.yml structure OK')
          "

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown exists
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CHANGELOG.md
          echo "Core markdown files present"
