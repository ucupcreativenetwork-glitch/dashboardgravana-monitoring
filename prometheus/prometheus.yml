# =============================================================================
# Prometheus Configuration — DashboardGravana Monitoring Stack
# Production-ready scrape configuration with multi-target support,
# file_sd, recording rules, alert rules, and federation readiness.
#
# Design principles:
# - Explicit job labels for every target class
# - Relabeling for consistent instance / job / environment labels
# - File-based service discovery (targets/*.json) — preferred for fleets
# - Blackbox multi-module probes (HTTP, ICMP, TCP, TLS, DNS)
# - Proxmox VE via pve-exporter + file_sd (profile: pve)
# - Support for future Kubernetes SD and federation
# - Retention and remote_write controlled via command-line / env
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: dashboardgravana
    environment: production
    monitor: dashboardgravana-stack

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s
      api_version: v2

# Rule files — alert + recording
rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/recording/*.yml

scrape_configs:
  # -------------------------------------------------------------------------
  # Self-monitoring
  # -------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: prometheus
          service: monitoring

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          component: alertmanager
          service: monitoring

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          component: grafana
          service: monitoring

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          component: loki
          service: monitoring

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]
        labels:
          component: blackbox
          service: monitoring

  # -------------------------------------------------------------------------
  # Host metrics — Node Exporter (file_sd preferred for multi-node)
  # Edit prometheus/targets/nodes.json to add hosts without restart
  # -------------------------------------------------------------------------
  - job_name: node-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/nodes.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "([^:]+):.*"
        replacement: "${1}"

  # -------------------------------------------------------------------------
  # Container metrics — cAdvisor
  # -------------------------------------------------------------------------
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          component: container
          service: docker
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: ".+"
        target_label: compose_project

  # -------------------------------------------------------------------------
  # Blackbox — HTTP probes (file_sd)
  # -------------------------------------------------------------------------
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-http.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        regex: "https?://([^/]+).*"
        target_label: host
        replacement: "${1}"

  # -------------------------------------------------------------------------
  # Blackbox — ICMP probes (file_sd)
  # -------------------------------------------------------------------------
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-icmp.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # -------------------------------------------------------------------------
  # Blackbox — TCP connect (file_sd)
  # -------------------------------------------------------------------------
  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-tcp.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # -------------------------------------------------------------------------
  # Blackbox — TLS / SSL certificate (file_sd)
  # -------------------------------------------------------------------------
  - job_name: blackbox-ssl
    metrics_path: /probe
    params:
      module: [tls_connect]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-ssl.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # -------------------------------------------------------------------------
  # Blackbox — DNS (file_sd)
  # -------------------------------------------------------------------------
  - job_name: blackbox-dns
    metrics_path: /probe
    params:
      module: [dns_a]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-dns.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # -------------------------------------------------------------------------
  # Uptime Kuma
  # -------------------------------------------------------------------------
  - job_name: uptime-kuma
    static_configs:
      - targets: ["uptime-kuma:3001"]
        labels:
          component: uptime
          service: synthetic

  # -------------------------------------------------------------------------
  # Proxmox VE Exporter (profile: pve)
  # Enable: docker compose --profile pve up -d
  # Targets = Proxmox API host:8006 in prometheus/targets/pve.json
  # Exporter proxies metrics; relabel maps API address → pve-exporter:9221
  # -------------------------------------------------------------------------
  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
      cluster: ["1"]
      node: ["1"]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/pve.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
    scrape_timeout: 30s

  # -------------------------------------------------------------------------
  # Federation (multi-Prometheus / hierarchical setup)
  # -------------------------------------------------------------------------
  # - job_name: federate
  #   scrape_interval: 30s
  #   honor_labels: true
  #   metrics_path: /federate
