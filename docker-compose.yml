# DashboardGravana — Docker Compose (profiles: default | pve | exporters | snmp)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-restart: &default-restart
  restart: unless-stopped

services:
  grafana:
    image: grafana/grafana:11.2.0
    container_name: dg-grafana
    <<: *default-restart
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP:-false}
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_AUTH_ANONYMOUS_ENABLED:-false}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/config/grafana.ini:/etc/grafana/grafana.ini:ro
    networks: [monitoring]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      alertmanager:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dg-prometheus
    <<: *default-restart
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-50GB}
      - --web.enable-lifecycle
      - --web.enable-admin-api
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/recording:/etc/prometheus/recording:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    networks: [monitoring]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: dg-alertmanager
    <<: *default-restart
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=0.0.0.0:9094
    networks: [monitoring]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  loki:
    image: grafana/loki:3.1.1
    container_name: dg-loki
    <<: *default-restart
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks: [monitoring]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.1.1
    container_name: dg-promtail
    <<: *default-restart
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks: [monitoring]
    depends_on:
      loki:
        condition: service_healthy
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: dg-node-exporter
    <<: *default-restart
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks: [monitoring]
    pid: host
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: dg-cadvisor
    <<: *default-restart
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]
    privileged: true
    devices: [/dev/kmsg]
    logging: *default-logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: dg-blackbox-exporter
    <<: *default-restart
    ports:
      - "${BLACKBOX_EXPORTER_PORT:-9115}:9115"
    volumes:
      - ./prometheus/blackbox.yml:/config/blackbox.yml:ro
    command: [--config.file=/config/blackbox.yml]
    cap_add: [NET_RAW]
    networks: [monitoring]
    logging: *default-logging

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.13
    container_name: dg-uptime-kuma
    <<: *default-restart
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks: [monitoring]
    logging: *default-logging

  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.4.5
    container_name: dg-pve-exporter
    <<: *default-restart
    ports:
      - "${PVE_EXPORTER_PORT:-9221}:9221"
    volumes:
      - ./pve-exporter/pve.yml:/etc/prometheus/pve.yml:ro
    command: [--config.file=/etc/prometheus/pve.yml]
    environment:
      PVE_USER: ${PVE_USER:-monitoring@pve}
      PVE_PASSWORD: ${PVE_PASSWORD:-}
      PVE_TOKEN_NAME: ${PVE_TOKEN_NAME:-}
      PVE_TOKEN_VALUE: ${PVE_TOKEN_VALUE:-}
    networks: [monitoring]
    profiles: [pve, proxmox]
    logging: *default-logging

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: dg-mysqld-exporter
    <<: *default-restart
    profiles: [exporters]
    ports:
      - "${MYSQLD_EXPORTER_PORT:-9104}:9104"
    environment:
      DATA_SOURCE_NAME: "${MYSQL_EXPORTER_DSN:-monitoring:CHANGE_ME@(mariadb:3306)/}"
    networks: [monitoring]
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: dg-redis-exporter
    <<: *default-restart
    profiles: [exporters]
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    environment:
      REDIS_ADDR: "${REDIS_EXPORTER_ADDR:-redis://redis:6379}"
    networks: [monitoring]
    logging: *default-logging

  snmp-exporter:
    image: prom/snmp-exporter:v0.26.0
    container_name: dg-snmp-exporter
    <<: *default-restart
    profiles: [snmp]
    ports:
      - "${SNMP_EXPORTER_PORT:-9116}:9116"
    volumes:
      - ./snmp-exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    command: [--config.file=/etc/snmp_exporter/snmp.yml]
    networks: [monitoring]
    logging: *default-logging

networks:
  monitoring:
    driver: bridge
    name: dashboardgravana-monitoring

volumes:
  grafana_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  uptime_kuma_data:
