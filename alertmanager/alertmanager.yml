# Safe default — starts without external webhooks.
# Multi-channel: ./scripts/render-alertmanager-config.sh from alertmanager.yml.tmpl
global:
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'null'
  group_by: ['alertname', 'severity', 'cluster', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "emergency"
      receiver: 'null'
      group_wait: 0s
      repeat_interval: 15m
    - matchers:
        - severity = "critical"
      receiver: 'null'
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity = "warning"
      receiver: 'null'
      group_wait: 1m
      repeat_interval: 6h

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'instance']
  - source_matchers:
      - severity = "emergency"
    target_matchers:
      - severity =~ "critical|warning"
    equal: ['alertname', 'instance']
  - source_matchers:
      - alertname = "NodeDown"
    target_matchers:
      - alertname =~ ".+"
    equal: ['instance']

receivers:
  - name: 'null'
