# Copy to docker-compose.override.yml (gitignored)
# Bind admin UIs to localhost — reverse proxy only
services:
  grafana:
    ports:
      - "127.0.0.1:3000:3000"
  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
  alertmanager:
    ports:
      - "127.0.0.1:9093:9093"
  loki:
    ports:
      - "127.0.0.1:3100:3100"
  uptime-kuma:
    ports:
      - "127.0.0.1:3001:3001"
