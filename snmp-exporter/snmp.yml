# Starter snmp_exporter config — replace community; prefer SNMPv3 + generated modules
auths:
  public_v2:
    community: public
    security_level: noAuthNoPriv
    version: 2

modules:
  if_mib:
    walk:
      - 1.3.6.1.2.1.1
      - 1.3.6.1.2.1.2
      - 1.3.6.1.2.1.31.1.1
    max_repetitions: 25
    retries: 3
    timeout: 5s
